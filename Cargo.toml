[package]
name = "noot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "noot-settings"
path = "src/bin/noot-settings.rs"

[dependencies]
anyhow = "1"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
googletest = "0.14"
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
